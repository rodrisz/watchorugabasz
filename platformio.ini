; PlatformIO Project Configuration File
;
; watchorugabasz — Comunicacion ESP-NOW entre T-Watch y XIAO ESP32-C3
;
; Entornos:
;   lilyorugabasz    → T-Watch 2020 V2 (emisor, botones ON/OFF) — legacy
;   orugabasz        → XIAO ESP32-C3 (receptor, controla LED) — legacy
;   watchcoherenciasz → T-Watch 2020 V2 (DISPOSITIVO C del sistema
;                       Mindcoherenciasz: HMI con 4 paginas, ESP-NOW
;                       bidireccional con puentesz)

[env:lilyorugabasz]
platform = espressif32
board = ttgo-t-watch
framework = arduino
upload_port = COM13
monitor_port = COM13
monitor_speed = 115200
build_src_filter = +<lilyorugabasz/>
build_flags = -Wno-discarded-qualifiers
lib_extra_dirs = ${PROJECT_DIR}/../lilygosz/lib

[env:orugabasz]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
build_src_filter = +<orugabasz/>

; ─────────────────────────────────────────────────────────────────────────
;  DISPOSITIVO C — watchcoherenciasz (T-Watch 2020 V2)
;  HMI 4 paginas, ESP-NOW bidireccional con puentesz (dispositivo B)
; ─────────────────────────────────────────────────────────────────────────
[env:watchcoherenciasz]
platform        = espressif32
board           = ttgo-t-watch
framework       = arduino
upload_port     = COM13
monitor_port    = COM13
monitor_speed   = 115200
upload_speed    = 460800     ; mas tolerante que 921600, menos fallos AXP202
build_src_filter = +<watchcoherenciasz/>
build_flags     = -Wno-discarded-qualifiers
                  -DCORE_DEBUG_LEVEL=2
lib_extra_dirs  = ${PROJECT_DIR}/../lilygosz/lib
